<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeny — помощник для научной работы</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="rail">
    <p class="brand">Jeny</p>
    <p class="brand-sub">черновик из ваших статей</p>
    <nav>
      <button class="nav on" data-view="doc">Документ</button>
      <button class="nav" data-view="lib">Библиотека</button>
    </nav>
    <div class="rail-lib" id="railPapers"></div>
    <button class="ghost-add" id="openAdd">+ статья</button>
  </aside>

  <main class="stage">
    <header class="docbar">
      <input id="title" maxlength="160" aria-label="Название документа">
      <p class="save-hint" id="saveHint">черновик на этом компьютере</p>
    </header>

    <section class="doc-view" id="viewDoc">
      <textarea id="draft" spellcheck="true" placeholder="Пишите главу здесь. Продолжение и цитаты берутся только из библиотеки слева."></textarea>
      <div class="commands">
        <button data-ai="continue">Продолжить</button>
        <button data-ai="outline">План главы</button>
        <button data-ai="cite">Вставить цитату</button>
        <button data-ai="paraphrase">Пересказать выделенное</button>
        <button data-ai="complete">Дописать абзац</button>
      </div>
    </section>

    <section class="lib-view" id="viewLib" hidden>
      <div class="lib-head">
        <h2>Библиотека</h2>
        <p>PDF или текст. Чат и автодополнение не ходят в интернет.</p>
      </div>
      <form id="addForm" class="add-form">
        <input id="pTitle" placeholder="Название" required>
        <input id="pAuthors" placeholder="Авторы">
        <input id="pYear" placeholder="Год" maxlength="8">
        <textarea id="pText" rows="7" placeholder="Текст статьи. Можно разметить страницы строками вида: стр. 2"></textarea>
        <div class="add-row">
          <label class="file">PDF или .txt
            <input id="pFile" type="file" accept=".pdf,.txt,application/pdf,text/plain" hidden>
          </label>
          <span id="pFileName" class="muted"></span>
          <button type="submit" class="primary">Положить в библиотеку</button>
        </div>
      </form>
      <div id="libList" class="lib-list"></div>
    </section>
  </main>

  <aside class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="chat">Чат</button>
      <button class="tab" data-tab="hits">Источники</button>
      <button class="tab" data-tab="check">Проверка цитаты</button>
    </div>

    <div id="tabChat" class="tab-body">
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="chat-form">
        <textarea id="question" rows="3" placeholder="Спросите только по загруженным статьям"></textarea>
        <button class="primary" type="submit">Спросить</button>
      </form>
    </div>

    <div id="tabHits" class="tab-body" hidden>
      <p class="muted" id="hitsEmpty">Здесь появятся куски из библиотеки после чата, плана или цитаты.</p>
      <div id="hits"></div>
    </div>

    <div id="tabCheck" class="tab-body" hidden>
      <p class="muted">Отдельная проверка: есть ли фраза на тексте страницы. Это не поиск смысла.</p>
      <label>Страница <input id="cPage" type="number" min="1" value="2"></label>
      <textarea id="cPageText" rows="6" placeholder="Текст одной страницы"></textarea>
      <textarea id="cQuote" rows="3" placeholder="Цитата из карточки"></textarea>
      <button class="primary" id="doCheck" type="button">Проверить</button>
      <div id="checkOut" class="check-out"></div>
    </div>
  </aside>
  <script src="/app.js"></script>
</body>
</html>
